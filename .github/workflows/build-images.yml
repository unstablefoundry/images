name: Build images

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    uses: ./.github/workflows/discover-changes.yml

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: build-image-${{ matrix.image }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image tag
        id: version
        run: |
          version_file="${{ matrix.image }}/VERSION"
          if [[ -f "$version_file" ]]; then
            tag=$(tr -d '[:space:]' < "$version_file")
            if [[ -z "$tag" ]]; then
              echo "VERSION file is empty in ${{ matrix.image }}" >&2
              exit 1
            fi
          else
            ref=$(grep -m1 '^FROM ' "${{ matrix.image }}/Dockerfile" | awk '{print $2}')
            ref=${ref%@*}
            [[ "$ref" == *:* ]] && tag=${ref##*:} || tag=latest
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

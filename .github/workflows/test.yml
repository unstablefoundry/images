name: Test images

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    uses: ./.github/workflows/discover-changes.yml

  hadolint:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: self-hosted
    strategy:
      matrix:
        image: ${{ fromJson(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ matrix.image }}/Dockerfile
          trusted-registries: ghcr.io
          failure-threshold: error

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJson(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image }}
          push: false
          platforms: linux/amd64

  workflows:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  test-report:
    if: always()
    needs:
      - changes
      - hadolint
      - build
      - workflows
    runs-on: ubuntu-latest
    steps:
      - name: Report results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HADOLINT_RESULT: ${{ needs.hadolint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
        run: |
          {
            echo "## Test report"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| changes | \`${CHANGES_RESULT}\` |"
            echo "| hadolint | \`${HADOLINT_RESULT}\` |"
            echo "| build | \`${BUILD_RESULT}\` |"
            echo "| workflows | \`${WORKFLOWS_RESULT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$CHANGES_RESULT" "$HADOLINT_RESULT" "$BUILD_RESULT" "$WORKFLOWS_RESULT"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "One or more jobs failed or were cancelled."
              exit 1
            fi
          done

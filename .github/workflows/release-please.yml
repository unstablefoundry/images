name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: self-hosted
    steps:
      - name: Get GitHub App token
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.UF_AUTOMATIONS_APP_ID }}
          private-key: ${{ secrets.UF_AUTOMATIONS_APP_PRIVATEKEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app_token.outputs.token }}
